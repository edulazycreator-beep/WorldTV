name: Android Build & Release

on:
  push:
    branches: [main, android]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Test & build APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building World TV for Android $VERSION (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/worldtv-release.jks"
            echo "WORLDTV_KEYSTORE_FILE=$RUNNER_TEMP/worldtv-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found — APK/AAB will be signed with it."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — the release APK is signed with a debug key (installable, but not suitable for Google Play)."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK and App Bundle
        env:
          WORLDTV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WORLDTV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WORLDTV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Collect artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/WorldTV-${VERSION}-android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/WorldTV-${VERSION}-android.aab"
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Verify APK
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="$(ls dist/*.apk)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -5
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -5

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: WorldTV-${{ steps.version.outputs.version }}-android
          path: android/dist/
          if-no-files-found: error

  smoke:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WorldTV-${{ needs.build.outputs.version }}-android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/scripts/smoke-test.sh "$(ls dist/*.apk)" smoke
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-screenshots
          path: smoke/
          if-no-files-found: ignore

  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WorldTV-${{ needs.build.outputs.version }}-android
          path: dist

      # Same tag as the macOS workflow: files are added to the same release.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: World TV ${{ needs.build.outputs.version }}
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: dist/*
