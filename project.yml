# XcodeGen spec — generates WorldTV.xcodeproj.
# Run `xcodegen generate` (or Scripts/build.sh, which does it for you).
name: WorldTV

options:
  bundleIdPrefix: io.github.worldtv
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Built with the Swift 6 compiler (Xcode 16+). The app sources use the
    # Swift 5 language mode with targeted concurrency checking; see README
    # ("Swift language mode") for how to switch to strict Swift 6 mode.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEAD_CODE_STRIPPING: YES
    # Ad-hoc signing by default; CI overrides this for Developer ID builds.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_HARDENED_RUNTIME: YES
    Debug:
      ONLY_ACTIVE_ARCH: YES
      # Hardened runtime's library validation would block the test bundle
      # from loading into the ad-hoc signed host app.
      ENABLE_HARDENED_RUNTIME: NO

targets:
  WorldTV:
    type: application
    platform: macOS
    sources:
      - path: WorldTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.worldtv.WorldTV
        PRODUCT_NAME: World TV
        PRODUCT_MODULE_NAME: WorldTV
        EXECUTABLE_NAME: WorldTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: WorldTV/Resources/WorldTV.entitlements
        INFOPLIST_FILE: WorldTV/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  WorldTVTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WorldTVTests
    dependencies:
      - target: WorldTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.worldtv.WorldTVTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/World TV.app/Contents/MacOS/WorldTV"

  WorldTVUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: WorldTVUITests
    dependencies:
      - target: WorldTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.worldtv.WorldTVUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WorldTV

schemes:
  WorldTV:
    build:
      targets:
        WorldTV: all
        WorldTVTests: [test]
        WorldTVUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: WorldTVTests
          parallelizable: false
        - name: WorldTVUITests
          parallelizable: false
    archive:
      config: Release
  WorldTVUnit:
    build:
      targets:
        WorldTV: all
        WorldTVTests: [test]
    test:
      config: Debug
      targets:
        - WorldTVTests
